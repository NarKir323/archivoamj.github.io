name: Validar sitio

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar sitio
        run: python scripts/validate_site.py
